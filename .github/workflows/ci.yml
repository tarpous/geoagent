name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --python 3.12 --extra dev
      - name: Lint
        run: uv run ruff check src tests evals
      - name: Unit and integration tests (offline fixtures)
        env:
          GEOAGENT_SWARM_RUNTIME: loop
        run: uv run pytest -q
      - name: Demo dry-run
        run: uv run python -m geoagent.demo --dry-run
      - name: LangGraph runtime smoke
        env:
          GEOAGENT_SWARM_RUNTIME: langgraph
        run: uv run pytest -q tests/test_langgraph_runtime.py tests/test_swarm_hero.py
      - name: Golden factory
        run: uv run python -m evals.factory.golden_v1
      - name: Handoff + topology gate
        run: uv run python -m evals.run handoff
      - name: Retrieval recall gate
        run: uv run python -m evals.run retrieval
      - name: Model download plan (no fetch)
        run: uv run python scripts/plan_model_downloads.py
