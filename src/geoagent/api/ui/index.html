<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>geoagent</title>
  <style>
    :root {
      --bg: #0f1714;
      --panel: #18241e;
      --ink: #e7f0ea;
      --muted: #9bb0a4;
      --accent: #6dbf8a;
      --line: #2a3b32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #1d3a2c 0%, transparent 40%),
        radial-gradient(circle at 90% 0%, #243a4a 0%, transparent 35%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 3.2rem);
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    .lede { color: var(--muted); max-width: 40rem; margin-bottom: 1.75rem; }
    form {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr auto;
      margin-bottom: 1.5rem;
    }
    input, button {
      font: inherit;
      border-radius: 0.4rem;
      border: 1px solid var(--line);
      padding: 0.85rem 1rem;
    }
    input { background: var(--panel); color: var(--ink); }
    button {
      background: var(--accent);
      color: #082014;
      font-weight: 600;
      cursor: pointer;
    }
    .panels {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1.1fr 0.9fr;
    }
    @media (max-width: 900px) {
      form, .panels { grid-template-columns: 1fr; }
    }
    section {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      padding: 1rem 1.1rem;
      min-height: 14rem;
    }
    h2 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    #map-frame {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      background: #101a15;
    }
    footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>geoagent</h1>
    <p class="lede">Local geospatial analyst swarm. Ask a multi-tool question and inspect the streamed handoff trace beside the final answer.</p>
    <form id="ask-form">
      <input id="question" value="How much tree cover was lost within 2 km of the new ring road since 2023?" />
      <button type="submit">Ask</button>
    </form>
    <div class="panels">
      <section>
        <h2>Answer</h2>
        <pre id="answer">Waiting…</pre>
        <h2 style="margin-top:1rem">Map</h2>
        <iframe id="map-frame" title="map preview"></iframe>
      </section>
      <section>
        <h2>Trace</h2>
        <pre id="trace">Waiting…</pre>
      </section>
    </div>
    <footer id="attribution">Map data © OpenStreetMap contributors (ODbL).</footer>
  </main>
  <script>
    const form = document.getElementById("ask-form");
    const answerEl = document.getElementById("answer");
    const traceEl = document.getElementById("trace");
    const mapFrame = document.getElementById("map-frame");
    const attributionEl = document.getElementById("attribution");

    function artifactUrl(path) {
      if (!path) return "";
      const normalized = String(path).replace(/\\\\/g, "/");
      const marker = "/artifacts/";
      const idx = normalized.lastIndexOf(marker);
      if (idx >= 0) return normalized.slice(idx);
      const demo = normalized.indexOf("artifacts/demo/");
      if (demo >= 0) return "/" + normalized.slice(demo);
      return "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      answerEl.textContent = "Running swarm…";
      traceEl.textContent = "";
      mapFrame.removeAttribute("src");
      const question = document.getElementById("question").value;
      const res = await fetch("/v1/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify({ question }),
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let finalPayload = null;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\\n\\n");
        buffer = chunks.pop() || "";
        for (const chunk of chunks) {
          const lines = chunk.split("\\n");
          let eventName = "message";
          let dataLine = "";
          for (const line of lines) {
            if (line.startsWith("event:")) eventName = line.slice(6).trim();
            if (line.startsWith("data:")) dataLine += line.slice(5).trim();
          }
          if (!dataLine) continue;
          const payload = JSON.parse(dataLine);
          if (eventName === "event") {
            const agent = payload.agent ? " @" + payload.agent : "";
            traceEl.textContent += `${payload.type || "event"}${agent} ${JSON.stringify(payload.payload || payload)}\\n`;
          }
          if (eventName === "done") finalPayload = payload;
        }
      }
      if (!finalPayload) {
        answerEl.textContent = "No SSE done event received.";
        return;
      }
      const fa = finalPayload.final_answer || {};
      if (finalPayload.attribution) attributionEl.textContent = finalPayload.attribution;
      answerEl.textContent = [
        `status: ${fa.status}`,
        "",
        fa.answer_md || "",
        "",
        "numbers:",
        JSON.stringify(fa.numbers || [], null, 2),
        "",
        `map: ${fa.map_artifact || "none"}`,
      ].join("\\n");
      const url = artifactUrl(fa.map_artifact);
      if (url) {
        const htmlGuess = url.replace(/\\.png$/i, ".html").replace(/\\.geojson$/i, ".html");
        mapFrame.src = htmlGuess;
      }
    });
  </script>
</body>
</html>
