services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: geoagent-postgis-pgvector:16
    container_name: geoagent-db
    environment:
      POSTGRES_USER: geoagent
      POSTGRES_PASSWORD: geoagent
      POSTGRES_DB: geoagent
    ports:
      - "5432:5432"
    volumes:
      - geoagent_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoagent -d geoagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: geoagent-api
    environment:
      GEOAGENT_DATABASE_URL: postgresql://geoagent:geoagent@db:5432/geoagent
      GEOAGENT_SWARM_RUNTIME: loop
      # LLM servers remain on the host when enabled later:
      # LLM_BASE_URL: http://host.docker.internal:8080/v1
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy

volumes:
  geoagent_pgdata:
