[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoagent"
version = "0.1.0"
description = "Local-first geospatial analyst swarm with TUI, web UI, and MCP clients"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "geoagent contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
  "ulid-py>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "rich>=13.7,<15",
  "mcp>=1.1,<2",
  "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
geoagent = "geoagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoagent"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/data",
  "/docs",
  "/NOTICE",
  "/README.md",
  "/AGENTS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP047"]
